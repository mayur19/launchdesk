openapi: 3.1.0
info:
  title: LaunchDesk API
  version: 0.1.0
  description:
    'Customer onboarding and implementation API. Every operation is marked `x-status: implemented|pending`
    and `x-ticket` with its backlog id. Pending operations return 501 NOT_IMPLEMENTED with the ticket in `error.details.ticket`.
    See docs/api/README.md for conventions.'
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:5173/api
    description: Local web dev server (proxied)
  - url: http://127.0.0.1:4103/api
    description: Local API
tags:
  - name: Health
  - name: Auth
  - name: Customers
  - name: Templates
  - name: Projects
  - name: Tasks
  - name: Milestones
  - name: Risks
  - name: Files
  - name: Activity
  - name: Customer portal
  - name: Reports
  - name: Notifications
  - name: Audit
paths:
  /health/live:
    get:
      tags:
        - Health
      summary: Liveness probe
      operationId: getLive
      x-status: implemented
      x-ticket: LD-004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthStatus'
      security: []
  /health/ready:
    get:
      tags:
        - Health
      summary: Readiness probe (checks PostgreSQL)
      operationId: getReady
      x-status: implemented
      x-ticket: LD-004
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/HealthStatus'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security: []
  /v1/auth/login:
    post:
      tags:
        - Auth
      summary: Sign in with email and password
      operationId: login
      x-status: implemented
      x-ticket: LD-003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /v1/auth/session:
    get:
      tags:
        - Auth
      summary: Current session and CSRF token
      operationId: getSession
      x-status: implemented
      x-ticket: LD-003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      security:
        - sessionCookie: []
  /v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Sign out and revoke the session
      operationId: logout
      x-status: implemented
      x-ticket: LD-003
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          loggedOut:
                            type: boolean
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
        - sessionCookie: []
          csrfToken: []
  /v1/me:
    get:
      tags:
        - Auth
      summary: Current user
      operationId: getMe
      x-status: implemented
      x-ticket: LD-003
