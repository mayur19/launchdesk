      security:
        - sessionCookie: []
  /v1/customers:
    get:
      tags:
        - Customers
      summary: List customer accounts of the caller tenant
      operationId: listCustomers
      x-status: implemented
      x-ticket: LD-008
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CustomerAccount'
                      meta:
                        $ref: '#/components/schemas/PageMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      description: 'Roles: PROVIDER_ADMIN, IMPLEMENTATION_MANAGER, PROVIDER_CONTRIBUTOR.'
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum:
              - ACTIVE
              - ARCHIVED
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
      security:
        - sessionCookie: []
    post:
      tags:
        - Customers
      summary: Create a customer account (audited)
      operationId: createCustomer
      x-status: implemented
      x-ticket: LD-008
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CustomerAccount'
          headers:
            Location:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
      description: 'Roles: PROVIDER_ADMIN.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      security:
        - sessionCookie: []
          csrfToken: []
  /v1/customers/{id}:
