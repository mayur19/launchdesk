components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sid
      description: Opaque httpOnly session cookie set by /v1/auth/login.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description:
        Required on unsafe methods for authenticated requests; value from SessionResponse.csrfToken.
        Origin must match APP_ORIGIN.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    Unauthenticated:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: UNAUTHENTICATED
              message: Authentication required
              requestId: 7b96ec33-e90e-47e6-a017-a79a3e983853
    Forbidden:
      description: You do not have permission to perform this action
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: FORBIDDEN
              message: You do not have permission to perform this action
              requestId: 7b96ec33-e90e-47e6-a017-a79a3e983853
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: NOT_FOUND
              message: Resource not found
              requestId: 7b96ec33-e90e-47e6-a017-a79a3e983853
    Conflict:
      description: Conflict with current state (duplicate or stale version)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: CONFLICT
              message: Conflict with current state (duplicate or stale version)
              requestId: 7b96ec33-e90e-47e6-a017-a79a3e983853
    ValidationFailed:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: VALIDATION_FAILED
              message: Request validation failed
              requestId: 7b96ec33-e90e-47e6-a017-a79a3e983853
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: RATE_LIMITED
              message: Too many requests
              requestId: 7b96ec33-e90e-47e6-a017-a79a3e983853
    ServiceUnavailable:
      description: Service unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: SERVICE_UNAVAILABLE
              message: Service unavailable
              requestId: 7b96ec33-e90e-47e6-a017-a79a3e983853
    NotImplemented:
      description: Not implemented yet (tracked as LD-xxx)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            data: null
            error:
              code: NOT_IMPLEMENTED
              message: Not implemented yet (tracked as LD-xxx)
              requestId: 7b96ec33-e90e-47e6-a017-a79a3e983853
  schemas:
    Envelope:
      type: object
      required:
        - success
        - data
        - error
      properties:
        success:
          type: boolean
          const: true
        data: {}
        error:
          type: 'null'
        meta:
          $ref: '#/components/schemas/PageMeta'
    ErrorEnvelope:
      type: object
      required:
        - success
        - data
        - error
      properties:
        success:
          type: boolean
          const: false
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/ApiError'
    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - UNAUTHENTICATED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - INVALID_STATE_TRANSITION
            - RATE_LIMITED
            - CSRF_FAILED
            - NOT_IMPLEMENTED
            - SERVICE_UNAVAILABLE
            - INTERNAL_ERROR
        message:
          type: string
        details: {}
        requestId:
          type: string
    PageMeta:
      type: object
      required:
        - total
        - page
        - limit
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
    Role:
      type: string
      enum:
        - PROVIDER_ADMIN
        - IMPLEMENTATION_MANAGER
        - PROVIDER_CONTRIBUTOR
        - CUSTOMER_OWNER
        - CUSTOMER_MEMBER
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
    SessionUser:
      type: object
      required:
        - id
        - organizationId
        - organizationName
        - email
        - displayName
        - role
        - customerAccountId
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        organizationName:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        customerAccountId:
          type:
            - string
            - 'null'
          format: uuid
          description: Set for customer-portal users only.
    SessionResponse:
      type: object
      required:
        - user
        - csrfToken
      properties:
        user:
          $ref: '#/components/schemas/SessionUser'
        csrfToken:
          type: string
    CreateCustomerRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        industry:
          type:
            - string
            - 'null'
          maxLength: 100
        websiteText:
          type:
            - string
            - 'null'
          maxLength: 300
        primaryContact:
          type:
            - string
            - 'null'
          maxLength: 200
    CustomerAccount:
      type: object
      required:
        - id
        - name
        - status
        - createdAt
        - updatedAt
        - version
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        industry:
          type:
            - string
            - 'null'
        websiteText:
          type:
            - string
            - 'null'
        primaryContact:
          type:
            - string
            - 'null'
        status:
          type: string
          enum:
            - ACTIVE
            - ARCHIVED
        archivedAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
